<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThawDay · Coming November 2026</title>
<meta name="description" content="Tell it when dinner is. It tells you when to buy, thaw, brine, and roast the turkey. Free forever. No ads. No accounts.">
<style>
  :root { --accent: #b45309; --ink: #1a1a1a; --muted: #6b7280; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: #fffdf8; line-height: 1.5;
    display: flex; flex-direction: column; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
    text-align: center; padding: 4rem 1.5rem 3.5rem; max-width: 42rem; margin: 0 auto; width: 100%;
  }
  .steps {
    display: flex; align-items: flex-start; justify-content: center; gap: 0;
    margin-top: 2.75rem; width: 100%; max-width: 30rem;
  }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .step::before {
    content: ""; position: absolute; top: 0.45rem; left: -50%; width: 100%;
    border-top: 2px solid #e7d8c3;
  }
  .step:first-child::before { display: none; }
  .step .dot {
    width: 0.9rem; height: 0.9rem; border-radius: 50%; background: var(--accent);
    position: relative; z-index: 1; margin-bottom: 0.5rem;
  }
  .step .label { font-size: 0.9375rem; font-weight: 600; color: #374151; }
  .kicker {
    display: inline-block; font-size: 0.875rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 1.25rem;
    border: 1px solid var(--accent); border-radius: 999px; padding: 0.35rem 1rem;
  }
  h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 1rem; }
  .tagline { font-size: clamp(1.125rem, 4vw, 1.5rem); color: #374151; max-width: 32rem; margin-bottom: 2rem; }
  .promise { font-size: 1rem; font-weight: 600; color: var(--ink); }
  .promise span { color: var(--accent); }
  footer {
    text-align: center; padding: 2rem 1.5rem; border-top: 1px solid #e5e7eb;
    font-size: 0.9375rem; color: var(--muted);
  }
  footer p { margin-bottom: 0.5rem; }
  footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <span class="kicker">Coming November 2026</span>
  <h1>ThawDay</h1>
  <p class="tagline">Tell it when dinner is. It tells you when to buy, thaw, brine, and roast the turkey.</p>
  <p class="promise"><span>Free forever.</span> No ads. No accounts.</p>
  <div class="steps" aria-hidden="true">
    <div class="step"><span class="dot"></span><span class="label">Buy</span></div>
    <div class="step"><span class="dot"></span><span class="label">Thaw</span></div>
    <div class="step"><span class="dot"></span><span class="label">Brine</span></div>
    <div class="step"><span class="dot"></span><span class="label">Roast</span></div>
  </div>
</main>
<footer>
  <p>Made by Billy.</p>
</footer>
</body>
</html>
